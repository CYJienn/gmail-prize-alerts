name: Gmail Prize Alerts
on:
  schedule:
    - cron: '0 0 * * *'
    # Recovery is eligible only on 21 October 2026; the gate below enforces the year.
    - cron: '43 0 21 10 *'
  workflow_dispatch:
    inputs:
      command:
        description: 'dry-run first, telegram-test second, run for real email delivery'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - telegram-test
          - run
permissions:
  contents: write
concurrency:
  group: gmail-prize-alerts
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate dated recovery
        id: gate
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ "$EVENT_SCHEDULE" == "43 0 21 10 *" && "$(date -u +%F)" != "2026-10-21" ]]; then
            echo "scan=false" >> "$GITHUB_OUTPUT"
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.scan == 'true' 
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.scan == 'true'
        with:
          python-version: '3.13'
      - name: Install dependencies
        if: steps.gate.outputs.scan == 'true'
        run: python -m pip install -r requirements-lock.txt
      - name: Offline tests
        if: steps.gate.outputs.scan == 'true'
        run: python -m pytest -q
      - name: Scan and persist encrypted delivery state
        if: steps.gate.outputs.scan == 'true'
        env:
          GH_STATE_TOKEN: ${{ github.token }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_COMMAND: ${{ inputs.command || 'run' }}
        run: python -m prize_alerts.cloud
